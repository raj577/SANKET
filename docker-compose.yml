services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensibull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensibull}
      POSTGRES_DB: ${POSTGRES_DB:-sensibull}
    volumes:
      - sensibull_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensibull} -d ${POSTGRES_DB:-sensibull}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sensibull}:${POSTGRES_PASSWORD:-sensibull}@db:5432/${POSTGRES_DB:-sensibull}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      COLLECTOR_BOOTSTRAP_TOKEN: ${COLLECTOR_BOOTSTRAP_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage/sensibull
      STORAGE_MAX_CSV_BYTES: ${STORAGE_MAX_CSV_BYTES:-26214400}
      TRACKING_POLL_SECONDS: ${TRACKING_POLL_SECONDS:-15}
      PRICE_PERSIST_INTERVAL_SECONDS: ${PRICE_PERSIST_INTERVAL_SECONDS:-60}
      PRICE_STALE_AFTER_SECONDS: ${PRICE_STALE_AFTER_SECONDS:-300}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_SECRET_KEY: ${FYERS_SECRET_KEY:-}
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-http://localhost:8000/api/v1/market/fyers/callback}
      FYERS_TOKEN_FILE: /app/storage/fyers_token.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sensibull_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sensibull_pgdata:
  sensibull_storage:
